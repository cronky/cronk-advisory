<svg width="680" height="700" viewBox="0 0 680 700" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" xmlns="http://www.w3.org/2000/svg"><title>Generative AI reference architecture 2026, harness and three planes</title><desc>Demand management feeds an agent harness containing a plan, act and observe loop plus context assembly and budgeting. The harness draws on a context plane holding knowledge, memory, retrieval and entitlements, and an action plane holding tools via MCP and peer agents via A2A. Both planes feed output checking, which produces either a machine owned response with citations or an escalation to a human who owns the decision. Telemetry, evaluation, cost and energy metering runs across everything.</desc>
