<svg width="680" height="634" viewBox="0 0 680 634" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" xmlns="http://www.w3.org/2000/svg"><title>The context plane: knowledge, memory and state</title><desc>Ingestion and curation and query and entitlements both feed a retrieval and memory container holding a knowledge graph, a vector store, agent memory and a semantic cache. Results pass to rerank and assemble, which attaches provenance, producing grounded context for the harness. Session and task state runs underneath as a separate concern.</desc>
