# Experience: the evidence behind /work/, the home page "Selected experience" strip, the
# JSON-LD and llms.txt. Every template reads it through layouts/partials/experience/entries.html,
# which checks it on every build and applies the client display rules.
#
# CONFIDENTIALITY. This repository and the built site may become public. For a client who has
# not approved being named, store ONLY sector_label: never their name, url, logo, a slug or id
# derived from their name, or anything identifying in a comment. Keep the real name in your
# private notes and add it when approval lands. The build fails if a sector or hidden entry has
# a name, url or logo.
#
# Fields
#   id          stable, neutral slug (never derived from an anonymised client's name)
#   type        engagement | speaking | prior
#   draft       true keeps the entry out of production builds (shown with hugo server -D)
#   featured    true shows it in the home page strip (the newest four)
#   title       for speaking entries, leave out to use the talk's title from the cronky.net feed
#   feed_slug   speaking only: the talk's slug in the cronky.net feed (title, date, event, url).
#               A talk not in the feed gives title, period, event, location and speaking_role
#               (a role id from layouts/partials/speaking-roles.html) itself.
#   period      start as "YYYY", "YYYY-MM" or "YYYY-MM-DD": when the work started. The page shows the
#               month (no end dates); a day only refines the order
#   era         cronk-advisory | scott-logic | tanium | deloitte | personal
#   delivered_as optional, plain text: the service Cronk Advisory delivered, shown as "Service: ...".
#               Describe a service the company provides, never a job or position held in the
#               client's organisation (IR35): "Chief Architect-level advisory", not "Chief Architect"
#   client      display: named | sector | hidden
#                 named:  name renders as text; linked only if link_permitted and url;
#                         logo (under static/) only if logo_permitted; logo_on_dark for light logos;
#                         logo_plain for brands that forbid a box or keyline behind their logo
#                 sector: only sector_label renders
#                 hidden: the entry is not rendered anywhere
#               approval_status and approval_note are private reminders and never rendered
#   summary     one or two sentences, plain text
#   outcomes    short factual strings; leave empty rather than invent
#   services    tags from the services list below
#   photo       optional: src (under static/), alt, and wide: true for a 16:9 image (default 4:3).
#               A diagram gives diagram: { width, height } instead: shown whole, never cropped,
#               and linked to the full-size file
#   links       evidence: list of {label, url}; reference: {quote, attribution, permitted, pull_quote, year};
#               year (optional) dates the quote; it defaults to the year the work started.
#               pull_quote is an optional excerpt, copied word for word from quote, shown beside the
#               intro on /work/ when the full quote is too long (over 320 characters) to show there;
#               case_study: path to a page under /work/ (linked once it is published);
#               related: ids of other entries
#   highlight   optional: service ids (from the list below) whose service page should show this
#               entry first under "Recent work". Otherwise a page shows its client engagements,
#               then talks, newest first, three at most
#
# Any rendered field containing "TODO" fails a production build, so placeholders either stay
# in YAML comments or the entry stays draft: true.

services:
  - { id: fractional-cto,          label: "Fractional CTO",                page: "/services/chief-architecture" }
  - { id: architecture,            label: "Architecture",                  page: "/services/chief-architecture" }
