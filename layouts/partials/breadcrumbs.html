{{- if not .IsHome }}
{{- $parent := partial "breadcrumb-parent.html" . }}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ if .IsHome }}Home{{ else }}{{ .LinkTitle }}{{ end }}</a></li>
    {{- if and .IsHome $parent }}
    <li><a href="{{ $parent.RelPermalink }}">{{ $parent.LinkTitle }}</a></li>
    {{- end }}
    {{- end }}
    <li><span aria-current="page">{{ .LinkTitle }}</span></li>
  </ol>
</nav>
{{- end }}
