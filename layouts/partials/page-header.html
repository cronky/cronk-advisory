{{- /* Navy band at the top of every inner page: breadcrumbs, title and summary. */ -}}
<section class="page-header">
  <div class="section-inner">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="heading-lines">{{ .Params.page_heading | default .Title }}</h1>
    {{ with .Params.summary }}<p class="page-summary">{{ . }}</p>{{ end }}
  </div>
</section>
