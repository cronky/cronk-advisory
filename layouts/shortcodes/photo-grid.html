{{- /* A grid of photos from a front matter list (src, alt, caption). Usage: {{< photo-grid photos >}}
  Photos are 800 × 600 WebP under static/images/photos/, with metadata stripped (see AGENTS.md). */ -}}
{{- with index .Page.Params (.Get 0) }}
<div class="photo-grid">
  {{- range . }}
  <figure>
    <img src="{{ .src }}" alt="{{ .alt }}" width="800" height="600" loading="lazy">
    {{- with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}
  </figure>
  {{- end }}
</div>
{{- end }}
