{{- /* The Copernican shift: geocentric rings versus the ecosystem stack. Static SVG, no script. */ -}}
<div class="eco-shift" role="group" aria-label="The Copernican shift">
  <figure>
    <svg viewBox="0 0 200 200" role="img" aria-labelledby="eco-geo-cap">
      <circle class="eco-ring" cx="100" cy="100" r="92"/>
      <circle class="eco-ring" cx="100" cy="100" r="72"/>
      <circle class="eco-ring" cx="100" cy="100" r="53"/>
      <circle class="eco-ring" cx="100" cy="100" r="35"/>
      <text class="eco-ring-label" x="100" y="20">Biosphere</text>
      <text class="eco-ring-label" x="100" y="40">Society</text>
      <text class="eco-ring-label" x="100" y="59">Economy</text>
      <text class="eco-ring-label" x="100" y="77">Ecosystem</text>
      <circle class="eco-you" cx="100" cy="103" r="20"/>
      <text class="eco-tier-label" x="100" y="107">Us</text>
    </svg>
    <figcaption id="eco-geo-cap"><strong>Geocentric.</strong> Everything revolves around us, and nature ends up on the outer ring, filed as an externality.</figcaption>
  </figure>
  <span class="eco-to" aria-hidden="true">→</span>
  <figure>
    <svg viewBox="0 0 200 200" role="img" aria-labelledby="eco-stack-cap">
      <rect class="eco-t1" x="8" y="158" width="184" height="30" rx="3"/>
      <rect class="eco-t2" x="22" y="124" width="156" height="30" rx="3"/>
      <rect class="eco-t3" x="36" y="90" width="128" height="30" rx="3"/>
      <rect class="eco-t4" x="50" y="56" width="100" height="30" rx="3"/>
      <rect class="eco-t5" x="64" y="22" width="72" height="30" rx="3"/>
      <text class="eco-tier-label" x="100" y="177">Biosphere</text>
      <text class="eco-tier-label" x="100" y="143">Society</text>
      <text class="eco-tier-label" x="100" y="109">Economy</text>
      <text class="eco-tier-label" x="100" y="75">Ecosystem</text>
      <text class="eco-tier-label" x="100" y="41">Us</text>
    </svg>
    <figcaption id="eco-stack-cap"><strong>Ecosystem view.</strong> We take part in far larger systems and rest on them, with the biosphere as the foundation.</figcaption>
  </figure>
</div>
